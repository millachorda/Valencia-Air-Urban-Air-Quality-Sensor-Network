<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="980" rx="14" fill="#ffffff"/>

  <text x="50" y="56" font-size="28" font-weight="bold" fill="#0d1117">Valencia Air — Node 3 wiring</text>
  <text x="50" y="84" font-size="15" fill="#57606a">Coastal node — same wiring as nodes 1 and 2, inside a weatherproof enclosure</text>

  <!-- Power -->
  <rect x="360" y="120" width="280" height="46" rx="9" fill="#faeeda" stroke="#854f0b" stroke-width="1.6"/>
  <text x="500" y="148" font-size="14" fill="#633806" text-anchor="middle">5 V / 2 A USB-C charger  →  ESP32</text>
  <line x1="500" y1="166" x2="500" y2="208" stroke="#854f0b" stroke-width="2.2" marker-end="url(#punta)"/>

  <!-- ESP32 -->
  <rect x="385" y="210" width="230" height="210" rx="14" fill="#f1eff8" stroke="#534ab7" stroke-width="1.8"/>
  <text x="500" y="246" font-size="19" font-weight="bold" fill="#26215c" text-anchor="middle">ESP32 DevKit</text>
  <text x="500" y="268" font-size="13" fill="#534ab7" text-anchor="middle">ELEGOO (USB-C)</text>
  <text x="405" y="306" font-size="13" fill="#26215c">3V3</text>
  <text x="405" y="334" font-size="13" fill="#26215c">5V (VIN)</text>
  <text x="405" y="362" font-size="13" fill="#26215c">GND</text>
  <text x="595" y="306" font-size="13" fill="#26215c" text-anchor="end">GPIO21 (SDA)</text>
  <text x="595" y="334" font-size="13" fill="#26215c" text-anchor="end">GPIO22 (SCL)</text>
  <text x="595" y="362" font-size="13" fill="#26215c" text-anchor="end">GPIO16 (RX2)</text>
  <text x="595" y="390" font-size="13" fill="#26215c" text-anchor="end">GPIO17 (TX2)</text>

  <!-- I2C connection -->
  <circle cx="450" cy="420" r="4" fill="#185fa5"/>
  <path d="M450 420 L450 458 L270 458 L270 508" fill="none" stroke="#185fa5" stroke-width="2.2" marker-end="url(#punta)"/>
  <text x="282" y="486" font-size="12" font-weight="bold" fill="#185fa5">I2C</text>

  <!-- UART connection -->
  <circle cx="550" cy="420" r="4" fill="#0f6e56"/>
  <path d="M550 420 L550 458 L730 458 L730 508" fill="none" stroke="#0f6e56" stroke-width="2.2" marker-end="url(#punta)"/>
  <text x="660" y="486" font-size="12" font-weight="bold" fill="#0f6e56">UART</text>

  <!-- I2C box -->
  <rect x="60" y="510" width="420" height="230" rx="14" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.8"/>
  <text x="88" y="548" font-size="19" font-weight="bold" fill="#042c53">I2C bus (3.3 V)</text>
  <text x="88" y="572" font-size="13" fill="#185fa5">BME280 · SGP30 · OLED SH1106 display</text>
  <text x="88" y="610" font-size="14" fill="#0c447c">SDA   →   GPIO21</text>
  <text x="88" y="636" font-size="14" fill="#0c447c">SCL   →   GPIO22</text>
  <text x="88" y="662" font-size="14" fill="#0c447c">VCC   →   3V3</text>
  <text x="88" y="688" font-size="14" fill="#0c447c">GND   →   GND</text>
  <text x="88" y="718" font-size="11.5" fill="#185fa5">All three share the same pins; each has its own I2C address.</text>

  <!-- UART box -->
  <rect x="520" y="510" width="420" height="230" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.8"/>
  <text x="548" y="548" font-size="19" font-weight="bold" fill="#04342c">UART bus (5 V)</text>
  <text x="548" y="572" font-size="13" fill="#0f6e56">PMS5003 (particulate sensor)</text>
  <text x="548" y="610" font-size="14" fill="#085041">TX (sensor)   →   GPIO16 (RX2)</text>
  <text x="548" y="636" font-size="14" fill="#085041">RX (sensor)   →   GPIO17 (TX2)</text>
  <text x="548" y="662" font-size="14" fill="#085041">VCC   →   5V (VIN)</text>
  <text x="548" y="688" font-size="14" fill="#085041">GND   →   GND</text>
  <text x="548" y="718" font-size="11.5" fill="#0f6e56">Data line runs at 3.3 V: connects directly, no level shifter needed.</text>

  <!-- Enclosure section -->
  <rect x="60" y="772" width="880" height="158" rx="14" fill="#fcf0eb" stroke="#993c1d" stroke-width="1.8"/>
  <text x="88" y="808" font-size="19" font-weight="bold" fill="#4a1b0c">Weatherproof enclosure (coastal node only)</text>
  <text x="88" y="836" font-size="13" fill="#993c1d">CPROSP IP65 box, 150 x 110 x 70 mm — protects against rain and sea salt</text>
  <text x="88" y="872" font-size="14" fill="#712b13">• Cable gland (included with box)  →  sealed power cable entry</text>
  <text x="88" y="898" font-size="14" fill="#712b13">• 2x PVC elbows facing down  →  airflow for the PMS5003 without letting water in</text>
  <text x="88" y="922" font-size="11.5" fill="#993c1d">Seal seams and cable entry with neutral silicone (SIKA SikaSeal 174).</text>

  <text x="50" y="962" font-size="12" fill="#8b949e">Node 3 (coastal park) — same electronics as nodes 1 and 2, mounted inside the IP65 enclosure.</text>
</svg>